openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Finni CO2 Calculator API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: projects
  - name: building
  - name: versions
  - name: products
  - name: emission-factors
  - name: emission-sources
  - name: validation
  - name: calculations
  - name: reports
  - name: audit
  - name: bim
  - name: tenant-epd
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users:
    get:
      operationId: getUsers
      tags: [users]
      summary: List tenant users (tenant-admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "403":
          description: Not a tenant admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createUser
      tags: [users]
      summary: Create user in current tenant (tenant-admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a tenant admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user in current tenant (tenant-admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validation error (e.g. last admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a tenant admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found in tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Remove user from current tenant (tenant-admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Validation error (e.g. last admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a tenant admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found in tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects:
    get:
      operationId: getProjects
      tags: [projects]
      parameters:
        - name: limit
          in: query
          description: Page size (max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated project list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
    post:
      operationId: createProject
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    patch:
      operationId: updateProject
      tags: [projects]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Validation error or project archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/archive:
    post:
      operationId: archiveProject
      tags: [projects]
      summary: Archive project (tenant editors)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Archived project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Already archived or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/unarchive:
    post:
      operationId: unarchiveProject
      tags: [projects]
      summary: Restore archived project (tenant editors)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Restored project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Not archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/versions/{versionId}/building:
    get:
      operationId: getBuilding
      tags: [building]
      summary: Building snapshot for a version
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Building data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Building"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: upsertBuilding
      tags: [building]
      summary: Upsert building (draft version only; tenant editors)
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertBuildingRequest"
      responses:
        "200":
          description: Building upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Building"
        "400":
          description: Validation or locked version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/versions:
    get:
      operationId: getVersions
      tags: [versions]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Version"
    post:
      operationId: createVersion
      tags: [versions]
      summary: Create empty draft version
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVersionRequest"
      responses:
        "201":
          description: Created draft version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "400":
          description: Invalid request or project archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/versions/clone:
    post:
      operationId: cloneVersion
      tags: [versions]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloneVersionRequest"
      responses:
        "201":
          description: Cloned version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"

  /versions/{versionId}:
    get:
      operationId: getVersion
      tags: [versions]
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Version details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"

  /versions/{versionId}/lock:
    post:
      operationId: lockVersion
      tags: [versions]
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LockVersionRequest"
      responses:
        "200":
          description: Locked version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "400":
          description: Already locked, not a draft, or validation preconditions failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not allowed to lock (admin/reviewer only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /versions/{versionId}/products:
    get:
      operationId: getProducts
      tags: [products]
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /versions/{versionId}/products/import/preview:
    post:
      operationId: previewProductImport
      tags: [products]
      summary: Parse and validate an Excel file (draft versions only)
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "200":
          description: Parsed rows and validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImportPreviewResponse"
        "400":
          description: Missing file or parse error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /versions/{versionId}/products/import/commit:
    post:
      operationId: commitProductImport
      tags: [products]
      summary: Import validated rows (re-validated server-side; draft only)
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductImportCommitRequest"
      responses:
        "201":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImportCommitResponse"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /versions/{versionId}/bim-import/preview:
    post:
      operationId: previewBimImport
      tags: [bim]
      summary: Parse IFC STEP file (draft versions only); preview building + product mapping
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "200":
          description: Parsed IFC preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BimImportPreviewResponse"
        "400":
          description: Missing file or parse error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /versions/{versionId}/bim-import/commit:
    post:
      operationId: commitBimImport
      tags: [bim]
      summary: Apply building and/or products from confirmed preview (re-validated server-side; draft only)
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BimImportCommitRequest"
      responses:
        "201":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BimImportCommitResponse"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{id}:
    patch:
      operationId: updateProduct
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /products/{id}/duplicate:
    post:
      operationId: duplicateProduct
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Duplicated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /emission-factors:
    get:
      operationId: getEmissionFactors
      tags: [emission-factors]
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: unit
          in: query
          schema:
            type: string
        - name: sourceType
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
          description: Case-insensitive substring match on source name and category
      responses:
        "200":
          description: List of emission factors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmissionFactor"

  /emission-sources:
    get:
      operationId: getEmissionSources
      tags: [emission-sources]
      summary: List enabled external CO₂ integrations (catalog drivers)
      responses:
        "200":
          description: External source registry entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExternalCo2SourceInfo"

  /emission-sources/{key}/sync:
    post:
      operationId: syncEmissionSource
      tags: [emission-sources]
      summary: Sync external factors into tenant catalog (admin only)
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sync completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalCo2SyncResponse"
        "400":
          description: Source disabled or not implemented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown source key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tenant/emission-factors/managed:
    get:
      operationId: getTenantEmissionFactorsManaged
      tags: [tenant-epd]
      summary: List tenant-authored EPD records (admin/editor); includes archived
      responses:
        "200":
          description: Emission factor rows for this tenant only
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmissionFactor"
        "403":
          description: Not allowed to manage tenant EPDs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tenant/emission-factors:
    post:
      operationId: createTenantEmissionFactor
      tags: [tenant-epd]
      summary: Create tenant-specific EPD factor (sourceType EPD)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantEpdCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmissionFactor"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tenant/emission-factors/{id}:
    patch:
      operationId: updateTenantEmissionFactor
      tags: [tenant-epd]
      summary: Update tenant EPD record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantEpdUpdateRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmissionFactor"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found or not a manageable tenant EPD row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tenant/emission-factors/{id}/archive:
    post:
      operationId: archiveTenantEmissionFactor
      tags: [tenant-epd]
      summary: Archive (deactivate) tenant EPD record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmissionFactor"
        "400":
          description: Already archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /versions/{versionId}/validation:
    get:
      operationId: getValidation
      tags: [validation]
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"

  /versions/{versionId}/calculations:
    get:
      operationId: getCalculations
      tags: [calculations]
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Calculation breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculationResult"

  /versions/{versionId}/reports:
    get:
      operationId: getReports
      tags: [reports]
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"

  /versions/{versionId}/reports/pdf:
    post:
      operationId: generatePdfReport
      tags: [reports]
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Generated PDF report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /versions/{versionId}/reports/xlsx:
    post:
      operationId: generateXlsxReport
      tags: [reports]
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Generated XLSX report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /reports/{reportId}/download:
    get:
      operationId: downloadReport
      tags: [reports]
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /projects/{projectId}/audit:
    get:
      operationId: getAuditLog
      tags: [audit]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Audit log entries for the project (project, versions, building, products, exports)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLogEntry"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/versions/{versionId}/audit:
    get:
      operationId: getVersionAuditLog
      tags: [audit]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Audit log entries for this version only
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLogEntry"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [projects]
      responses:
        "200":
          description: Dashboard summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          description: Machine-readable reason when applicable (e.g. VERSION_LOCKED, LOCK_PRECONDITIONS_FAILED).
        summary:
          type: string
        failedChecks:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              message:
                type: string
            required: [id, message]
        fieldErrors:
          type: object
          additionalProperties:
            type: string
          description: Per-field validation messages (e.g. product PATCH/POST).
      required: [error]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum: [admin, editor, reviewer, viewer]
        tenantId:
          type: string
        tenantName:
          type: string
      required: [id, email, fullName, role, tenantId, tenantName]

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum: [admin, editor, reviewer, viewer]
        tenantId:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, email, fullName, role, tenantId, createdAt]

    CreateUserRequest:
      type: object
      properties:
        email:
          type: string
        fullName:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [admin, editor, reviewer, viewer]
      required: [email, fullName, password, role]

    UpdateUserRequest:
      type: object
      properties:
        fullName:
          type: string
        role:
          type: string
          enum: [admin, editor, reviewer, viewer]

    ProjectListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectSummary"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required: [items, total, limit, offset]

    ProjectSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        locationCountry:
          type: string
        buildingType:
          type: string
        archivedAt:
          type: string
          format: date-time
          nullable: true
          description: When set, project is archived (read-only for data changes until restored)
        latestVersionStatus:
          type: string
          nullable: true
        latestVersionNumber:
          type: integer
          nullable: true
        updatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required: [id, name, locationCountry, buildingType, updatedAt, createdAt]

    Project:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        locationCountry:
          type: string
        buildingType:
          type: string
        tenantId:
          type: string
        createdByUserId:
          type: string
        archivedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, locationCountry, buildingType, tenantId, createdByUserId, createdAt, updatedAt]

    CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
        locationCountry:
          type: string
          default: "FI"
        buildingType:
          type: string
      required: [name, buildingType]

    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
        locationCountry:
          type: string
        buildingType:
          type: string

    Space:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        areaM2:
          type: number
      required: [id, name, areaM2]

    Building:
      type: object
      properties:
        id:
          type: string
        versionId:
          type: string
        grossAreaM2:
          type: number
          nullable: true
        spaces:
          type: array
          items:
            $ref: "#/components/schemas/Space"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, versionId, spaces, createdAt, updatedAt]

    UpsertBuildingRequest:
      type: object
      properties:
        grossAreaM2:
          type: number
          description: Required on save; must be non-negative
        spaces:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              areaM2:
                type: number
            required: [name, areaM2]
      required: [grossAreaM2, spaces]

    Version:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        versionNumber:
          type: integer
        status:
          type: string
          enum: [draft, locked]
        createdByUserId:
          type: string
        createdByName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        lockedAt:
          type: string
          format: date-time
          nullable: true
        lockedByUserId:
          type: string
          nullable: true
        lockedByName:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
      required: [id, projectId, versionNumber, status, createdByUserId, createdAt]

    CloneVersionRequest:
      type: object
      properties:
        sourceVersionId:
          type: string
        notes:
          type: string
      required: [sourceVersionId]

    CreateVersionRequest:
      type: object
      properties:
        notes:
          type: string
          description: Optional label / notes for the new draft

    LockVersionRequest:
      type: object
      properties:
        notes:
          type: string

    Product:
      type: object
      properties:
        id:
          type: string
        versionId:
          type: string
        name:
          type: string
        category:
          type: string
        quantityValue:
          type: number
          nullable: true
        quantityUnit:
          type: string
          enum: [kg, m2, m3]
          nullable: true
        emissionFactorId:
          type: string
          nullable: true
        emissionSourceType:
          type: string
          enum: [generic, EPD, product, external]
          nullable: true
        emissionSourceName:
          type: string
          nullable: true
        emissionUnitSnapshot:
          type: string
          nullable: true
        co2ePerUnitSnapshot:
          type: number
          nullable: true
        emissionExternalSourceKey:
          type: string
          nullable: true
          description: External integration key snapshotted at factor attach time
        emissionExternalRecordId:
          type: string
          nullable: true
          description: Stable record id from external dataset at attach time
        moduleA1A3Share:
          type: number
        moduleA4Share:
          type: number
        moduleA5Share:
          type: number
        moduleBShare:
          type: number
        moduleCShare:
          type: number
        co2eTotal:
          type: number
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, versionId, name, category, moduleA1A3Share, moduleA4Share, moduleA5Share, moduleBShare, moduleCShare, createdAt, updatedAt]

    CreateProductRequest:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        quantityValue:
          type: number
          nullable: true
        quantityUnit:
          type: string
          enum: [kg, m2, m3]
          nullable: true
      required: [name, category]

    ProductImportRow:
      type: object
      description: Validated product row (same rules as create + module shares)
      properties:
        name:
          type: string
        category:
          type: string
        quantityValue:
          type: number
          nullable: true
        quantityUnit:
          type: string
          nullable: true
        moduleA1A3Share:
          type: number
        moduleA4Share:
          type: number
        moduleA5Share:
          type: number
        moduleBShare:
          type: number
        moduleCShare:
          type: number
      required:
        [name, category, moduleA1A3Share, moduleA4Share, moduleA5Share, moduleBShare, moduleCShare]

    ProductImportPreviewRow:
      type: object
      properties:
        excelRow:
          type: integer
        ok:
          type: boolean
        fieldErrors:
          type: object
          additionalProperties:
            type: string
        data:
          $ref: "#/components/schemas/ProductImportRow"
      required: [excelRow, ok]

    ProductImportPreviewResponse:
      type: object
      properties:
        worksheetName:
          type: string
        structureOk:
          type: boolean
        structureError:
          type: string
          nullable: true
        code:
          type: string
          nullable: true
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ProductImportPreviewRow"
        validCount:
          type: integer
        errorCount:
          type: integer
      required: [worksheetName, structureOk, rows, validCount, errorCount]

    ProductImportCommitRequest:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ProductImportRow"
      required: [rows]

    ProductImportCommitResponse:
      type: object
      properties:
        imported:
          type: integer
        productIds:
          type: array
          items:
            type: string
      required: [imported, productIds]

    BimImportPreviewSpace:
      type: object
      properties:
        sourceExpressId:
          type: integer
        name:
          type: string
        areaM2:
          type: number
          nullable: true
      required: [sourceExpressId, name]

    BimImportPreviewProductRow:
      type: object
      properties:
        sourceExpressId:
          type: integer
        ifcType:
          type: string
        ok:
          type: boolean
        fieldErrors:
          type: object
          additionalProperties:
            type: string
        data:
          $ref: "#/components/schemas/ProductImportRow"
      required: [sourceExpressId, ifcType, ok]

    BimImportPreviewResponse:
      type: object
      properties:
        structureOk:
          type: boolean
        structureError:
          type: string
          nullable: true
        schemaName:
          type: string
          nullable: true
        scopeNotes:
          type: array
          items:
            type: string
        buildingName:
          type: string
          nullable: true
        suggestedGrossAreaM2:
          type: number
          nullable: true
        spaces:
          type: array
          items:
            $ref: "#/components/schemas/BimImportPreviewSpace"
        warnings:
          type: array
          items:
            type: string
        productRows:
          type: array
          items:
            $ref: "#/components/schemas/BimImportPreviewProductRow"
        stats:
          type: object
          properties:
            spaceCount:
              type: integer
            productCandidates:
              type: integer
            productOk:
              type: integer
            productError:
              type: integer
          required: [spaceCount, productCandidates, productOk, productError]
      required: [structureOk, scopeNotes, spaces, warnings, productRows, stats]

    BimImportCommitBuilding:
      type: object
      properties:
        grossAreaM2:
          type: number
        spaces:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              areaM2:
                type: number
            required: [name, areaM2]
      required: [grossAreaM2, spaces]

    BimImportCommitRequest:
      type: object
      properties:
        applyBuilding:
          type: boolean
        building:
          $ref: "#/components/schemas/BimImportCommitBuilding"
        products:
          type: array
          items:
            $ref: "#/components/schemas/ProductImportRow"
      required: [applyBuilding, products]

    BimImportCommitResponse:
      type: object
      properties:
        importedProducts:
          type: integer
        productIds:
          type: array
          items:
            type: string
        buildingUpdated:
          type: boolean
      required: [importedProducts, productIds, buildingUpdated]

    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        quantityValue:
          type: number
          nullable: true
        quantityUnit:
          type: string
          enum: [kg, m2, m3]
          nullable: true
        emissionFactorId:
          type: string
          nullable: true
        moduleA1A3Share:
          type: number
        moduleA4Share:
          type: number
        moduleA5Share:
          type: number
        moduleBShare:
          type: number
        moduleCShare:
          type: number

    EmissionFactor:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
          nullable: true
          description: Null = platform-wide catalog; set = tenant-owned factor
        sourceType:
          type: string
          enum: [generic, EPD, product, external]
        sourceName:
          type: string
        category:
          type: string
        unit:
          type: string
          enum: [kg, m2, m3]
        co2ePerUnit:
          type: number
        active:
          type: boolean
        externalSourceKey:
          type: string
          nullable: true
        externalRecordId:
          type: string
          nullable: true
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
      required: [id, sourceType, sourceName, category, unit, co2ePerUnit, active]

    ExternalCo2SourceInfo:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        displayName:
          type: string
        description:
          type: string
          nullable: true
        hasHandler:
          type: boolean
      required: [id, key, displayName, hasHandler]

    ExternalCo2SyncResponse:
      type: object
      properties:
        upserted:
          type: integer
        sourceKey:
          type: string
      required: [upserted, sourceKey]

    TenantEpdCreateRequest:
      type: object
      properties:
        sourceName:
          type: string
        category:
          type: string
        unit:
          type: string
          enum: [kg, m2, m3]
        co2ePerUnit:
          type: number
          minimum: 0
      required: [sourceName, category, unit, co2ePerUnit]

    TenantEpdUpdateRequest:
      type: object
      properties:
        sourceName:
          type: string
        category:
          type: string
        unit:
          type: string
          enum: [kg, m2, m3]
        co2ePerUnit:
          type: number
          minimum: 0

    ValidationFixTarget:
      type: object
      description: Suggested navigation target relative to project version routes.
      properties:
        kind:
          type: string
          enum: [building, products, calculation, product]
        productId:
          type: string
          description: Set when kind is product
      required: [kind]

    ValidationCheck:
      type: object
      properties:
        id:
          type: string
        passed:
          type: boolean
        message:
          type: string
        severity:
          type: string
          description: error = blocking (lock), warning = review, info = contextual (never blocks lock)
          enum: [error, warning, info]
        group:
          type: string
          enum: [project, building, products, calculation, data_quality]
        fixTarget:
          $ref: "#/components/schemas/ValidationFixTarget"
      required: [id, passed, message, severity, group]

    ValidationSummary:
      type: object
      properties:
        blockingFailed:
          type: integer
        blockingPassed:
          type: integer
        warningFailed:
          type: integer
        warningPassed:
          type: integer
        infoFailed:
          type: integer
        infoPassed:
          type: integer
      required: [blockingFailed, blockingPassed, warningFailed, warningPassed, infoFailed, infoPassed]

    ValidationResult:
      type: object
      properties:
        versionId:
          type: string
        projectId:
          type: string
        passed:
          type: boolean
        summary:
          $ref: "#/components/schemas/ValidationSummary"
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ValidationCheck"
      required: [versionId, projectId, passed, summary, checks]

    ModuleBreakdown:
      type: object
      properties:
        module:
          type: string
        co2eTotal:
          type: number
        productBreakdown:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
              productName:
                type: string
              co2eContribution:
                type: number
            required: [productId, productName, co2eContribution]
      required: [module, co2eTotal, productBreakdown]

    CalculationSummary:
      type: object
      properties:
        totalProducts:
          type: integer
        includedInCalculation:
          type: integer
        excludedIncomplete:
          type: integer
      required: [totalProducts, includedInCalculation, excludedIncomplete]

    CalculationProductLine:
      type: object
      description: Product row snapshot used for CO₂e engine output (deterministic).
      properties:
        id:
          type: string
        name:
          type: string
        quantityValue:
          type: number
          nullable: true
        co2ePerUnitSnapshot:
          type: number
          nullable: true
        moduleA1A3Share:
          type: number
        moduleA4Share:
          type: number
        moduleA5Share:
          type: number
        moduleBShare:
          type: number
        moduleCShare:
          type: number
        co2eTotal:
          type: number
          nullable: true
        eligibility:
          type: string
          enum: [included, excluded_incomplete]
        exclusionReason:
          type: string
          nullable: true
        baseCo2e:
          type: number
          nullable: true
      required:
        - id
        - name
        - moduleA1A3Share
        - moduleA4Share
        - moduleA5Share
        - moduleBShare
        - moduleCShare
        - co2eTotal
        - eligibility

    CalculationResult:
      type: object
      properties:
        engineVersion:
          type: string
          description: Server calculation engine semver (same inputs + version ⇒ same outputs).
        computedAt:
          type: string
          format: date-time
        versionId:
          type: string
        grandTotal:
          type: number
        modules:
          type: array
          items:
            $ref: "#/components/schemas/ModuleBreakdown"
        products:
          type: array
          items:
            $ref: "#/components/schemas/CalculationProductLine"
        summary:
          $ref: "#/components/schemas/CalculationSummary"
      required: [engineVersion, computedAt, versionId, grandTotal, modules, products, summary]

    Report:
      type: object
      properties:
        id:
          type: string
        versionId:
          type: string
        type:
          type: string
          enum: [PDF, XLSX]
        filePath:
          type: string
        createdByUserId:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, versionId, type, filePath, createdByUserId, createdAt]

    AuditLogEntry:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        userName:
          type: string
          nullable: true
        entityType:
          type: string
        entityId:
          type: string
        action:
          type: string
        createdAt:
          type: string
          format: date-time
        diffPreview:
          description: Sanitized, size-limited JSON snapshot (no passwords; strings truncated)
          nullable: true
      required: [id, userId, entityType, entityId, action, createdAt]

    DashboardSummary:
      type: object
      properties:
        totalProjects:
          type: integer
        draftVersions:
          type: integer
        lockedVersions:
          type: integer
        totalProducts:
          type: integer
        recentProjects:
          type: array
          items:
            $ref: "#/components/schemas/ProjectSummary"
      required: [totalProjects, draftVersions, lockedVersions, totalProducts, recentProjects]
